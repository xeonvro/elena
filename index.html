<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App</title>
  <style>
    /* 1. Theme Color Variables */
    :root {
      --bg-color: #ffffff;
      --text-color: #0f172a;
      --card-bg: #f8fafc;
      --border-color: #e2e8f0;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
      --border-color: #334155;
      --btn-bg: #f8fafc;
      --btn-text: #0f172a;
    }

    /* 2. Global Base Styles */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* 3. Toggle Button Styles */
    .theme-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.1s ease, background-color 0.3s ease, color 0.3s ease;
    }

    .theme-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Theme Switcher</h1>
    <p>Click the button below to toggle between Day and Night mode.</p>
    
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">Dark Mode</span>
    </button>
  </main>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');

    // Load saved theme from localStorage or default to system preference
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      
      if (theme === 'dark') {
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light Mode';
      } else {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark Mode';
      }
    }

    // Apply active theme on page load
    applyTheme(initialTheme);

    // Toggle event listener
    toggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });
  </script>
</body>
</html>
